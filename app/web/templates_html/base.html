<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} | ControlClientes</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

    <button
        onclick="window.scrollTo({top: 0, behavior: 'smooth'})"
        style="
            position:fixed;
            bottom:20px;
            right:20px;
            width:55px;
            height:55px;
            border:none;
            border-radius:50%;
            background:linear-gradient(90deg,#6366f1,#8b5cf6);
            color:white;
            font-size:24px;
            cursor:pointer;
            z-index:999999;
            box-shadow:0 5px 15px rgba(0,0,0,0.25);
        "
    >
        ↑
    </button>

    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h2>ControlClientes</h2>
                <p>Gestión local</p>
            </div>

            <nav class="sidebar-nav">
                <a href="/" class="nav-link {% if page_title == 'Dashboard' %}active{% endif %}">Dashboard</a>
                <a href="/clientes/" class="nav-link {% if page_title == 'Clientes' %}active{% endif %}">Clientes</a>
                <a href="/cuotas/" class="nav-link {% if page_title == 'Cuotas' %}active{% endif %}">Cuotas</a>
                <a href="/pagos/" class="nav-link {% if page_title == 'Pagos' %}active{% endif %}">Pagos</a>
                <a href="/deudas/" class="nav-link {% if page_title == 'Deudas' %}active{% endif %}">Deudas</a>
                <a href="/exportaciones/" class="nav-link {% if page_title == 'Exportaciones' %}active{% endif %}">Exportaciones</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <h1>{{ page_title }}</h1>
            </header>

            <section class="content-area">
                {% block content %}{% endblock %}
            </section>
        </main>
    </div>

    <script src="/static/js/app.js"></script>

    <script>
    function subirArriba() {
        document.querySelector(".main-content").scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }
    </script>

</body>
</html>
